version: "3.8"
services:
  5gc:
    image: rptestbed/open5gs:v2.7.0-ubuntu22.04-20260413
    build:
      context: ./srsRAN_Project/docker/open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.0"
    pull_policy: if_not_present
    container_name: open5gs_5gc
    env_file:
      - ./project-config/open5gs.env
    privileged: true
    ports:
      - "9999:9999/tcp"
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 60
    volumes:
      - ./project-config/subscriber_db.csv:/open5gs/subscriber_db.csv:ro
      - ./project-config/open5gs-5gc.yml:/open5gs/open5gs-5gc.yml:ro
    networks:
      ran:
        ipv4_address: 10.53.1.2

  gnb:
    image: rptestbed/srsran-gnb:ubuntu24.04-uhd-zeromq-20260413
    build:
      context: ./srsRAN_Project/docker
      dockerfile: Dockerfile
      args:
        OS_VERSION: "24.04"
        EXTRA_CMAKE_ARGS: "-DENABLE_ZEROMQ=On -DENABLE_UHD=On -DENABLE_EXPORT=On -DENABLE_MKL=False -DENABLE_DPDK=Off"
    pull_policy: if_not_present
    container_name: srsran_gnb
    privileged: true
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    volumes:
      - /dev/bus/usb/:/dev/bus/usb/
      - /usr/share/uhd/images:/usr/share/uhd/images
      - ./project-config/gnb/gnb_zmq_external_ue.yml:/gnb_config.yml:ro
      - ./project-config/gnb/gnb_compose_config.yml:/gnb_compose_config.yml:ro
    command: gnb -c /gnb_config.yml -c /gnb_compose_config.yml
    depends_on:
      5gc:
        condition: service_healthy
    networks:
      ran:
        ipv4_address: 10.53.1.3
      metrics:
        ipv4_address: 172.19.1.3
      ue_n3:
        ipv4_address: 10.10.3.231

volumes:
  gnb-storage: {}

networks:
  ran:
    ipam:
      driver: default
      config:
        - subnet: 10.53.1.0/24
  metrics:
    ipam:
      driver: default
      config:
        - subnet: 172.19.1.0/24
  ue_n3:
    external: true
    name: ue_n3
