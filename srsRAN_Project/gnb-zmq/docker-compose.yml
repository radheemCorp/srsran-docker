services:
  5gc:
    image: open5gs:20260507-dpdk
    build:
      context: ../docker/open5gs
      target: open5gs
      args:
        OS_VERSION: "22.04"
        OPEN5GS_VERSION: "v2.7.0"
    pull_policy: if_not_present
    container_name: open5gs_5gc
    env_file:
      - ./project-config/open5gs.env
    privileged: true
    ports:
      - "9999:9999/tcp"
      - "38412:38412/sctp"
      - "2152:2152/udp"
    command: 5gc -c open5gs-5gc.yml
    healthcheck:
      test: [ "CMD-SHELL", "nc -z 127.0.0.20 7777" ]
      interval: 3s
      timeout: 1s
      retries: 60
    volumes:
      - ./project-config/subscriber_db.csv:/open5gs/subscriber_db.csv:ro
      # Mount the template (.in) so the container entrypoint can envsubst
      # into a generated open5gs-5gc.yml inside the container. Mounting
      # the final rendered file directly to /open5gs/open5gs-5gc.yml prevents
      # the entrypoint from writing the generated file and causes a
      # "Read-only file system" error.
      - ./project-config/open5gs-5gc.yml.in:/open5gs/open5gs-5gc.yml.in:ro
    networks:
      n2:
        ipv4_address: 10.53.1.2
      
  gnb:
    image: gnb:20260507-dpdk
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        OS_VERSION: "24.04"
        EXTRA_CMAKE_ARGS: "-DENABLE_ZEROMQ=On -DENABLE_UHD=On -DENABLE_EXPORT=On -DENABLE_MKL=False -DENABLE_DPDK=Off"
    pull_policy: if_not_present
    container_name: srsran_gnb
    privileged: true
    cap_add:
      - SYS_NICE
      - CAP_SYS_PTRACE
    volumes:
      - /dev/bus/usb/:/dev/bus/usb/
      - /usr/share/uhd/images:/usr/share/uhd/images
      - ./project-config/gnb/gnb_zmq.yml:/gnb_config.yml:ro # ZMQ RF
      - ./project-config/gnb/gnb_compose_config.yml:/gnb_compose_config.yml:ro
      - ./gnb-storage:/tmp
    command: gnb -c /gnb_config.yml -c /gnb_compose_config.yml
    depends_on:
      5gc:
        condition: service_healthy
    networks:
      n2:
        ipv4_address: 10.53.1.3
      n3:
        ipv4_address: 10.10.3.231
      metrics:
        ipv4_address: 172.19.1.3
      

volumes:
  gnb-storage: {}

networks:
  n2:
    external: true
    name: n2
  n3:
    external: true
    name: n3
  metrics:
    external: true
    name: metrics
