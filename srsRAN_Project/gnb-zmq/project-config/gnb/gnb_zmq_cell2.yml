# ZMQ gNB configuration — CELL 2 of the two-cell slicing setup.
# Same 5GC/PLMN/ARFCN as cell 1 (gnb_zmq.yml); differs by:
#   gnb_id 2 / PCI 2 / slice sst=2
#   N3 IP   10.10.3.232 (vs .231),  N2 bind 10.53.1.4 (vs .3)
#   ZMQ     gNB tx 10.10.3.232:2010, rx 10.10.4.237:2011 (bridge2)
#   E2 bind 10.0.2.26 (vs .25)
# In ZMQ the two cells share dl_arfcn 368500 (separate baseband wires, no
# interference); UEs reach cell 2 by being wired to bridge2.

gnb_id: 2
ran_node_name: gnb02

cu_cp:
  amf:
    addr: 10.53.1.2
    port: 38412
    bind_addr: 10.53.1.4
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 2
  inactivity_timer: 7200

ru_sdr:
  device_driver: zmq
  # gNB2 TX -> bridge2 RX, gNB2 RX <- bridge2 TX (ports 2010/2011).
  device_args: tx_port=tcp://10.10.3.232:2010,rx_port=tcp://10.10.4.237:2011,base_srate=23.04e6
  srate: 23.04
  tx_gain: 80
  rx_gain: 40

cell_cfg:
  pci: 2
  dl_arfcn: 368500
  band: 3
  channel_bandwidth_MHz: 20
  common_scs: 15
  plmn: "00101"
  tac: 7
  # Cell 2 offers slice sst=2 only.
  slicing:
    - sst: 2
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
    total_nof_ra_preambles: 64
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: false
  mac_filename: /tmp/gnb_mac.pcap
  ngap_enable: false
  ngap_filename: /tmp/gnb_ngap.pcap
  e2ap_enable: true
  e2ap_du_filename: /tmp/gnb_du_e2ap.pcap
  e2ap_cu_cp_filename: /tmp/gnb_cu_cp_e2ap.pcap
  e2ap_cu_up_filename: /tmp/gnb_cu_up_e2ap.pcap

e2:
  enable_du_e2: true
  enable_cu_cp_e2: true
  enable_cu_up_e2: true
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true
  e2sm_ccc_enabled: false
  addr: 10.0.2.10
  bind_addr: 10.0.2.26
  port: 36421
