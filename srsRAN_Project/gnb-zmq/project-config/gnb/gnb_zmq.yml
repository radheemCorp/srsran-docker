# ZMQ gNB configuration for external UE bridge deployment.
# This file is the ZMQ-RF variant; keep `gnb_zmq_external_ue.yml` for UHD-RF.
#
# Matches external_ue bridge defaults:
#   gNB N3 IP     : 10.10.3.231
#   bridge IP     : 10.10.3.236
#   gNB tx/rx port: 2000/2001
#
# Cell 1 of the two-cell slicing setup: PCI 1, offers slice sst=1.
# Cell 2 is gnb_zmq_cell2.yml (PCI 2, sst=2). Distinct gnb_id per gNB so the
# AMF sees two Global gNB IDs.

gnb_id: 1
ran_node_name: gnb01

cu_cp:
  amf:
    addr: 10.53.1.2
    port: 38412
    bind_addr: 10.53.1.3
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
  inactivity_timer: 7200
    
ru_sdr:
  # Use ZMQ RF frontend.
  device_driver: zmq
  # gNB TX -> external_ue bridge RX, and gNB RX <- bridge TX.
  # Route gNB ZMQ RF streams to the bridge defaults (gNB side ports 2000/2001).
  device_args: tx_port=tcp://10.10.3.231:2000,rx_port=tcp://10.10.4.237:2001,base_srate=23.04e6
  srate: 23.04
  tx_gain: 80
  rx_gain: 40

cell_cfg:
  pci: 1
  dl_arfcn: 368500
  band: 3      # must match rat.nr.band in ue config
  channel_bandwidth_MHz: 20
  common_scs: 15   #  106 x 12 x 15kHz
  plmn: "00101"
  tac: 7
  # Cell 1 offers slice sst=1 only (cell 2 offers sst=2).
  slicing:
    - sst: 1
  pdcch:
    dedicated:
      ss2_type: common
      dci_format_0_1_and_1_1: false
    common:
      ss0_index: 0
      coreset0_index: 12
  prach:
    prach_config_index: 1
    total_nof_ra_preambles: 64
  pdsch:
    mcs_table: qam64
  pusch:
    mcs_table: qam64

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: false                 # Set to true to enable MAC-layer PCAPs.
  mac_filename: /tmp/gnb_mac.pcap   # Path where the MAC PCAP is stored.
  ngap_enable: false                # Set to true to enable NGAP PCAPs.
  ngap_filename: /tmp/gnb_ngap.pcap # Path where the NGAP PCAP is stored.
  e2ap_enable: true                 # Set to true to enable E2AP PCAPs.
  e2ap_du_filename: /tmp/gnb_du_e2ap.pcap       # Path where the DU E2AP PCAP is stored.
  e2ap_cu_cp_filename: /tmp/gnb_cu_cp_e2ap.pcap # Path where the CU-CP E2AP PCAP is stored.
  e2ap_cu_up_filename: /tmp/gnb_cu_up_e2ap.pcap # Path where the CU-UP E2AP PCAP is stored.


# E2 DISABLED for the two-cell branch. Running two gNBs that both establish E2
# to the same RIC e2term segfaults the gNB in send_e2_setup_request. E2 is KPM
# monitoring only and not needed for attach/slicing. FOLLOW-UP: resolve two-node
# E2 (or dedicate one RIC per gNB), then re-enable. For single-cell use you can
# set these back to true.
e2:
  enable_du_e2: false
  enable_cu_cp_e2: false
  enable_cu_up_e2: false
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true
  e2sm_ccc_enabled: true
  addr: 10.0.2.10
  bind_addr: 10.0.2.25
  port: 36421