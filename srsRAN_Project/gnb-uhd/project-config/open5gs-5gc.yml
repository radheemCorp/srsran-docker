db_uri: mongodb://${MONGODB_IP}/open5gs

logger:
  file:
    path: /var/log/open5gs/mme.log
    timestamp: true

test:
  serving:
    - plmn_id:
        mcc: 001
        mnc: 01

global:
  parameter:
    no_ipv6: true
    no_sepp: true

mme:
  freeDiameter:
    identity: mme.localdomain
    realm: localdomain
    listen_on: 127.0.0.2
    no_fwd: true
  s1ap:
    server:
      - address: ${OPEN5GS_IP}
  gtpc:
    server:
      - address: ${OPEN5GS_IP}
    client:
      sgwc:
        - address: 127.0.0.3
      smf:
        - address: 127.0.0.4
  gummei:
    - plmn_id:
        mcc: 001
        mnc: 01
      mme_gid: 2
      mme_code: 1
  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: 7
  security:
    integrity_order: [EIA2, EIA1, EIA0]
    ciphering_order: [EEA0, EEA1, EEA2]
  network_name:
    full: ${NETWORK_NAME_FULL}
    short: ${NETWORK_NAME_SHORT}
  time:
    t3412:
      value: 540

smf:
  sbi:
    server:
      - address: 127.0.0.4
        port: 7777
    client:
      scp:
        - uri: http://127.0.0.22:7777
  pfcp:
    server:
      - address: 127.0.0.4
    client:
      upf:
        - address: 127.0.0.7
  gtpc:
    server:
      - address: 127.0.0.4
  gtpu:
    server:
      - address: 127.0.0.4
  metrics:
    server:
      - address: 127.0.0.4
        port: 9090
  session:
    - subnet: ${UE_IP_RANGE}
      gateway: ${UE_GATEWAY_IP}
  dns:
    - 8.8.8.8
    - 8.8.4.4
  mtu: 1400

amf:
  sbi:
    server:
      - address: 127.0.0.5
        port: 7777
  ngap:
    server:
      - address: ${OPEN5GS_IP}
  guami:
    - plmn_id:
        mcc: 001
        mnc: 01
      amf_id:
        region: 2
        set: 1
  tai:
    - plmn_id:
        mcc: 001
        mnc: 01
      tac: 7
  plmn_support:
    - plmn_id:
        mcc: 001
        mnc: 01
      s_nssai:
        - sst: 1
          sd: 0x111111
  security:
    integrity_order: [NIA2, NIA1, NIA0]
    ciphering_order: [NEA0, NEA1, NEA2]
  network_name:
    full: ${NETWORK_NAME_FULL}
    short: ${NETWORK_NAME_SHORT}
  amf_name: open5gs-amf0
  time:
    t3512:
      value: 540

upf:
  pfcp:
    server:
      - address: 127.0.0.7
  gtpu:
    server:
      - address: ${OPEN5GS_IP}
        advertise: ${UPF_ADVERTISE_IP}
  session:
    - subnet: ${UE_IP_RANGE}
      gateway: ${UE_GATEWAY_IP}
  nssai:
    - sst: 1
      sd: 0x111111