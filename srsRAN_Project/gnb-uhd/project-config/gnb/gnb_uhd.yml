# UHD gNB configuration.



cu_cp:
  amf:
    addr: 172.16.1.2
    port: 38412
    bind_addr: 172.16.1.1
    supported_tracking_areas:
      - tac: 7
        plmn_list:
          - plmn: "00101"
            tai_slice_support_list:
              - sst: 1
                sd: "1118481"  # 0x111111 in decimal


ru_sdr:
  # Use UHD with the connected B210 SDR. Set device serial to your device's serial.
  device_driver: uhd
  # Correct UHD device args: use serial= without extra 'addr=' wrapper
  device_args: type=b200,serial=30A3DFB,num_recv_frames=64,num_send_frames=64
  srate: 23.04
  tx_gain: 70
  rx_gain: 40

cell_cfg:
  dl_arfcn: 632628
  band: 78
  channel_bandwidth_MHz: 20
  common_scs: 30
  plmn: "00101"
  tac: 7
  pci: 1
  # The cell must declare the SAME slice (SST+SD) it advertises to the AMF in
  # cu_cp.tai_slice_support_list and that the core provisions (SD_VALUE). Without
  # this block the cell defaults to sst=1 / no-SD and will not admit a PDU session
  # on slice sst=1,sd=0x111111 even though NG Setup succeeds.
  slicing:
    - sst: 1
      sd: 1118481   # decimal of 0x111111 (srsRAN reads sd as DECIMAL)

log:
  filename: /tmp/gnb.log
  all_level: info

pcap:
  mac_enable: false                 # Set to true to enable MAC-layer PCAPs.
  mac_filename: /tmp/gnb_mac.pcap   # Path where the MAC PCAP is stored.
  ngap_enable: false                # Set to true to enable NGAP PCAPs.
  ngap_filename: /tmp/gnb_ngap.pcap # Path where the NGAP PCAP is stored.
  e2ap_enable: true                 # Set to true to enable E2AP PCAPs.
  e2ap_du_filename: /tmp/gnb_du_e2ap.pcap       # Path where the DU E2AP PCAP is stored.
  e2ap_cu_cp_filename: /tmp/gnb_cu_cp_e2ap.pcap # Path where the CU-CP E2AP PCAP is stored.
  e2ap_cu_up_filename: /tmp/gnb_cu_up_e2ap.pcap # Path where the CU-UP E2AP PCAP is stored.


e2:
  enable_du_e2: true
  enable_cu_cp_e2: true
  enable_cu_up_e2: true
  e2sm_kpm_enabled: true
  e2sm_rc_enabled: true
  e2sm_ccc_enabled: true
  addr: 10.0.2.10
  bind_addr: 141.24.211.31
  port: 36421
