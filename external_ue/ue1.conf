#####################################################################
#                   srsUE configuration file for UE1 (bridge mode)
#####################################################################

[rf]
freq_offset = 0
tx_gain = 80
rx_gain = 40
srate = 23.04e6
nof_antennas = 1
device_name = zmq
device_args = tx_port=tcp://10.10.3.234:2101,rx_port=tcp://10.10.3.236:2201,base_srate=23.04e6

[rat.nr]
bands = 3
nof_carriers = 1
nof_prb = 106
dl_arfcn = 368500
plmn = 00101
tac = 7

[log]
all_level = warning
phy_lib_level = none
all_hex_limit = 32
filename = /tmp/ue1.log
file_max_size = 1000

[usim]
mode = soft
algo = milenage
opc  = E8ED289DEBA952E4283B54E88E6183CA
k    = 465B5CE8B199B49FAA5F0A2EE238A6BC
imsi = 001010000000001
imei = 356938035643803

[rrc]
release = 15
ue_category = 4

[nas]
apn = internet
apn_protocol = ipv4

[gw]
netns = ue1
ip_devname = tun_srsue
ip_netmask = 255.255.255.0

[gui]
enable = false
