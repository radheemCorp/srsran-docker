services:
  srsran_zmq_bridge:
    image: ghcr.io/sulaimanalmani/srsranzmq/srsue:v1.1
    container_name: srsran_zmq_bridge
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - IPC_LOCK
    environment:
      - GNB_IP=10.53.1.3
      - BRIDGE_IP=10.53.1.6
      - UE_IP_BASE=233
      - UE_IP_PREFIX=10.54.1.
      - BIND_ALL=1
    networks:
      external_n3:
        ipv4_address: 10.53.1.6
        aliases:
          - srsran_zmq_bridge
      metrics:
        ipv4_address: 172.19.1.6
        aliases:
          - srsran_zmq_bridge
      ue_net:
        ipv4_address: 10.54.1.6
    volumes:
      - ./config:/srsran/config
    command: >
      /bin/bash -c "
      chmod +x /srsran/config/*.sh &&
      /srsran/config/start_bridge.sh ${NUM_UES:-10} ${UE_IDS:-1,2}"

networks:
  external_n3:
    external: true
    name: ran
  metrics:
    external: true
    name: metrics
  ue_net:
    name: ue-net
    external: true