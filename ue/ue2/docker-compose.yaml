services:
  srsran_ue_host:
    image: ghcr.io/sulaimanalmani/srsranzmq/srsue:v1.1
    container_name: ue2
    privileged: true
    networks:
      ue_n3:
        ipv4_address: 10.10.4.235
      # Reach InfluxDB (influxdb:8081) for UE metric export. Traffic still
      # runs over ue_n3 / tun_srsue; only ue_export.py uses this network.
      metrics:
        ipv4_address: 172.19.1.22
    cap_add:
      - NET_ADMIN
      - SYS_NICE
      - IPC_LOCK
    volumes:
      # Shared config dir for all UEs (start_ue.sh, run_scenario.sh, ue_export.py).
      - ../common/config:/srsran/config
    environment:
      - DEBUG_MODE=false
      - UE_NUM=2
      - GNB_IP=10.10.3.231
      - ZMQ_BRIDGE_IP=10.10.4.237
      - UE_BIND_IP=10.10.4.235
      - UE_ZMQ_MODE=bridge
      - UE_DNS1=1.1.1.1
      - UE_DNS2=8.8.8.8
      # InfluxDB export target (matches srsRAN docker .env).
      - INFLUX_URL=http://influxdb:8081
      - INFLUX_BUCKET=srsran
    # Keep the container alive; start the UE manually with start_ue.sh.
    command: >
      /bin/bash -c "
      mkdir -p /dev/net && { [ -e /dev/net/tun ] || mknod /dev/net/tun c 10 200; } &&
      chmod +x /srsran/config/*.sh /srsran/config/*.py 2>/dev/null;
      sleep infinity"

networks:
  ue_n3:
    external: true
    name: ue_n3
  metrics:
    external: true
    name: metrics
